[options]
; ── Rutas ──────────────────────────────────────────────
; Carpetas donde Odoo busca módulos (dentro del contenedor)
addons_path = /mnt/enterprise-addons,/mnt/extra-addons
; Directorio de datos (adjuntos, sesiones, filestore)
data_dir = /var/lib/odoo

; ── Base de datos ──────────────────────────────────────
db_host = db          ; nombre del servicio en docker-compose
db_port = 5432
db_user = odoo
db_password = odoo
; db_name =           ; fija una sola BD (opcional)
; dbfilter = ^%d$     ; filtra qué BDs se muestran

; ── Seguridad ──────────────────────────────────────────
; Contraseña maestra para crear/eliminar BDs (usa hash, no texto plano)
admin_passwd = $pbkdf2-sha512$600000$...tu_hash...
